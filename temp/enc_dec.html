<html>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/aes.js"></script>
    <h1>AES encrypt/decrypt online using CryptoJS</h1>

  <br>text:<input id='text' type='text' value='0.1'/>


    <br><button onclick="encrypt()">encrypt</button>

    <br>result:<br><span id='result'></span>

    <br>decoded:<br><span id="decrypted"></span>

    <br><button onclick="decrypt()">decrypt</button>

    <script>
    
    
    function encrypt()
    {
     document.getElementById('result').innerHTML = encryptCredentials(document.getElementById('text').value);
    }
    function decrypt()
    {
         document.getElementById('decrypted').innerHTML = decryptCredentials(document.getElementById('result').innerHTML);
    }
     var encryptCredentials = (str) => { return (CryptoJS.AES.encrypt(str,"ams.vnsguit.org")); }        

     var decryptCredentials = (str) => { return ( CryptoJS.AES.decrypt(str, "ams.vnsguit.org").toString(CryptoJS.enc.Utf8) ); }        
    

        </script>

</html>
